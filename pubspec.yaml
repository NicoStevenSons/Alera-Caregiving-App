name: alera
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  sqflite: ^2.4.3
  path: ^1.9.1
  workmanager: ^0.10.9
  flutter_svg: ^2.2.0
  flutter_secure_storage: 10.3.1
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^22.3.0
  supabase_flutter: ^2.17.2
  timezone: ^0.11.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  battery_plus: ^7.1.1
  fl_chart: ^1.2.0
  alera_toast:
    path: packages/alera_toast

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#ffffff"
  android_12:
    color: "#ffffff"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/alera-logo-no-padding.png"
  adaptive_icon_background: "#F5F5F5"
  adaptive_icon_foreground: "assets/icons/alera-logo.png"

flutter:
  uses-material-design: true
  assets:
    - alera-figma-assets/assets/icons/status/
    - alera-figma-assets/assets/icons/mini_status/
    - alera-figma-assets/assets/icons/vitals/
    - alera-figma-assets/assets/icons/device_status/
    - alera-figma-assets/assets/icons/vitals/cards/
    - alera-figma-assets/assets/icons/vitals/card_icons/
    - alera-figma-assets/assets/icons/onboarding/
    - alera-figma-assets/assets/icons/devices/